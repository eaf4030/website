- id: llm-agents-commitment
  title: "Do LLM Agents Respond to Commitment? A Behavioral Experiment in Strategic Communication"
  authors:
    - Ebrahim Aliabadi Farahani
  date: 2026-11-01
  status: Working paper, November 2026
  pdf: /papers/llm-agents-commitment.pdf
  # ssrn: https://papers.ssrn.com/...
  abstract: >-
    As AI agents increasingly make decisions and communicate on behalf of
    individuals and organizations, understanding how they respond to
    institutional constraints becomes important. Commitment can make strategic
    communication informative by restricting how a sender may revise its
    communication after learning private information. We study whether LLM
    agents respond to mechanically enforced commitment as economic theory
    predicts, using the sender-receiver environment of Fréchette, Lizzeri, and
    Perego (2022). The experiment varies commitment strength and message
    verifiability, allowing comparisons with theoretical predictions and
    existing human experimental evidence. We find substantial differences
    across model configurations. Claude Sonnet 4.5 exhibits the
    commitment-blindness pattern documented among human subjects, whereas
    Claude Opus 5.5 and Gemini 3.8 Flash behave much closer to theory under
    full commitment. Under partial commitment, even models that make
    individually sensible revision decisions may choose initial communication
    plans that fail to anticipate those decisions. Our findings highlight the
    importance of evaluating strategic AI agents under different institutional
    arrangements rather than inferring their behavior from performance in a
    single environment.

- id: agent-mediated-search
  title: "Agent-Mediated Search, Preference Compression, and Congestion in Matching Markets"
  authors:
    - Ebrahim Aliabadi Farahani
  date: 2026-11-01
  status: Working paper, November 2026
  pdf: /papers/agent-mediated-search.pdf
  # ssrn: https://papers.ssrn.com/...
  abstract: >-
    As AI agents increasingly search for opportunities on behalf of people,
    they may fundamentally change how matching markets operate. By examining
    many more alternatives at little additional cost, agents can help users
    find better matches. Yet agents may not fully understand the preferences of
    the people they represent. When preference information is incomplete,
    agents may rely on common measures of quality and direct users with
    different tastes toward the same alternatives. In markets with limited
    capacity, these correlated choices can create congestion and offset the
    benefits of broader search. We study this tradeoff in a simple model and a
    controlled hotel-choice experiment. Our analysis shows that, despite
    expanding the set of opportunities users can explore, AI-mediated search
    can leave them worse off than searching without an agent.
